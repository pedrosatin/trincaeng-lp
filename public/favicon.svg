<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="12" fill="#07162C"/>
  <!-- Trinca Isometric Structural Triangle Emblem -->
  <!-- Top-left ascending beam -->
  <polygon points="12,35 44,12 44,23 23,38" fill="#547EC9"/>
  <!-- Bottom-left to right base beam -->
  <polygon points="12,35 23,38 43,49 43,54" fill="#3B5FA3"/>
  <!-- Right vertical structural column -->
  <polygon points="44,12 52,17 52,51 43,54 43,23" fill="#253E73"/>
  <!-- Inner structural bevel highlight -->
  <polygon points="23,38 43,23 43,31 31,41" fill="#84A9EA" opacity="0.85"/>
</svg>
